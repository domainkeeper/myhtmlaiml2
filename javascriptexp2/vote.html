<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vote</title>
</head>
<body>
    <p>Hello Pratham!</p>
    <script>
        let a = parseInt(prompt("Enter Age:"));
        if (a >= 18){
            alert("You are eligible for vote");
            let c = confirm("Do you want to vote:");
            if(c){
                alert("You voted for BJP. Enjoy!!");
            }
            else{
                alert("Deshdrohi")
            }
        }
        else{
            alert("Not eligible for vote");
        }
    </script>
</body>
</html>
